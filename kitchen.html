<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Иман Кафе — Кухня (KDS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="p-6 min-h-screen">
  <header class="flex items-center justify-between pb-6 mb-6 border-b border-gray-800">
    <div class="flex items-center gap-3">
      <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
      <h1 class="text-2xl font-extrabold tracking-tight">Кухня — Иман Кафе (Планшет)</h1>
    </div>
    <div class="flex items-center gap-4 text-sm text-gray-400">
      <span>Активные заказы: <strong id="activeOrdersCount" class="text-white text-base">0</strong></span>
      <button id="enableAudioBtn" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-gray-950 font-bold rounded-xl transition">
        🔊 Включить звук
      </button>
    </div>
  </header>

  <main>
    <div id="kitchenOrdersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
    </div>

    <div id="noOrdersState" class="text-center py-24 text-gray-500">
      <svg class="w-16 h-16 mx-auto mb-4 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
      </svg>
      <h3 class="text-xl font-bold text-gray-400">Нет новых заказов</h3>
      <p class="text-sm mt-1 text-gray-500">Заказы от гостей по QR-коду появятся здесь мгновенно</p>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBohllCT8Jzt23W3kcjRt8n-yOUWZEfxcU",
      authDomain: "iman-menu.firebaseapp.com",
      databaseURL: "https://iman-menu-default-rtdb.firebaseio.com",
      projectId: "iman-menu",
      storageBucket: "iman-menu.firebasestorage.app",
      messagingSenderId: "227236434910",
      appId: "1:227236434910:web:83445bb6325c5cefff834f",
      measurementId: "G-ZHYW9DB8ZF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const gridEl = document.getElementById('kitchenOrdersGrid');
    const noOrdersStateEl = document.getElementById('noOrdersState');
    const activeOrdersCountEl = document.getElementById('activeOrdersCount');
    const enableAudioBtn = document.getElementById('enableAudioBtn');

    let audioAllowed = false;
    enableAudioBtn.addEventListener('click', () => {
      audioAllowed = true;
      enableAudioBtn.textContent = '🔊 Звук включен';
      enableAudioBtn.classList.remove('bg-amber-500', 'hover:bg-amber-400', 'text-gray-950');
      enableAudioBtn.classList.add('bg-emerald-600', 'text-white');
      playBeep();
    });

    function playBeep() {
      if (!audioAllowed) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } catch (e) {
        console.log(e);
      }
    }

    let previousOrdersCount = 0;

    const ordersRef = ref(db, 'orders');
    onValue(ordersRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        gridEl.innerHTML = '';
        noOrdersStateEl.classList.remove('hidden');
        activeOrdersCountEl.textContent = '0';
        previousOrdersCount = 0;
        return;
      }

      noOrdersStateEl.classList.add('hidden');
      const orders = Object.entries(data).map(([id, val]) => ({ id, ...val }));
      orders.sort((a, b) => b.timestamp - a.timestamp);

      const newOrdersCount = orders.filter(o => o.status === 'new').length;
      if (newOrdersCount > previousOrdersCount && previousOrdersCount !== -1) {
        playBeep();
      }
      previousOrdersCount = newOrdersCount;
      activeOrdersCountEl.textContent = newOrdersCount;

      gridEl.innerHTML = orders.map(order => {
        const isNew = order.status === 'new';
        const isCooking = order.status === 'cooking';
        
        let cardBg = 'bg-gray-800/90 border-gray-700';
        if (isNew) cardBg = 'bg-gray-800 border-amber-500 ring-2 ring-amber-500/50';
        if (isCooking) cardBg = 'bg-gray-800 border-blue-500';
        if (order.status === 'ready') cardBg = 'bg-gray-900/50 border-gray-800 opacity-60';

        const itemsHtml = order.items.map(i => `
          <div class="flex justify-between items-center text-sm py-1 border-b border-gray-700/50 last:border-0">
            <span class="font-medium text-gray-200">${i.name}</span>
            <span class="bg-gray-700 px-2 py-0.5 rounded font-bold text-xs text-amber-400">×${i.quantity}</span>
          </div>
        `).join('');

        return `
          <div class="${cardBg} border rounded-3xl p-5 flex flex-col justify-between shadow-xl transition-all">
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="px-3 py-1 bg-amber-500 text-gray-950 font-black text-sm rounded-xl uppercase tracking-wider">
                  Стол №${order.table}
                </span>
                <span class="text-xs text-gray-400 font-semibold">${order.timeString}</span>
              </div>

              <div class="space-y-1 my-3 bg-gray-900/40 p-3 rounded-2xl">
                ${itemsHtml}
              </div>
            </div>

            <div>
              <div class="flex items-center justify-between mb-3 pt-2 border-t border-gray-700/50">
                <span class="text-xs text-gray-400">Сумма:</span>
                <span class="font-extrabold text-white text-base">${order.total} сом</span>
              </div>

              <div class="grid grid-cols-2 gap-2">
                ${order.status === 'new' ? `
                  <button onclick="updateStatus('${order.id}', 'cooking')" class="col-span-2 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-xl transition">
                    Принять в работу 👨‍🍳
                  </button>
                ` : order.status === 'cooking' ? `
                  <button onclick="updateStatus('${order.id}', 'ready')" class="col-span-2 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-xl transition">
                    Готово / Выдать ✅
                  </button>
                ` : `
                  <button onclick="updateStatus('${order.id}', 'new')" class="py-1.5 bg-gray-700 hover:bg-gray-600 text-gray-300 font-medium text-xs rounded-lg transition">
                    Вернуть
                  </button>
                  <button onclick="deleteOrder('${order.id}')" class="py-1.5 bg-red-900/50 hover:bg-red-900 text-red-300 font-medium text-xs rounded-lg transition">
                    Удалить
                  </button>
                `}
              </div>
            </div>
          </div>
        `;
      }).join('');
    });

    window.updateStatus = async function(orderId, newStatus) {
      await update(ref(db, `orders/${orderId}`), { status: newStatus });
    }

    window.deleteOrder = async function(orderId) {
      if (confirm('Удалить этот заказ с экрана?')) {
        await remove(ref(db, `orders/${orderId}`));
      }
    }
  </script>
</body>
</html>
