<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Иман Кафе — Кухня (KDS Pro)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f8fafc; }
    /* Плавные переходы для смены статусов */
    .order-card { transition: all 0.25s ease-in-out; }
  </style>
</head>
<body class="p-4 sm:p-6 min-h-screen flex flex-col justify-between">

  <!-- ШАПКА ПЛАНШЕТА -->
  <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between pb-5 mb-6 border-b border-gray-800 gap-4">
    <div class="flex items-center gap-3">
      <span class="w-3.5 h-3.5 rounded-full bg-emerald-500 animate-pulse shadow-lg shadow-emerald-500/50"></span>
      <div>
        <h1 class="text-2xl font-black tracking-tight text-white">КУХНЯ — KDS PRO</h1>
        <p class="text-xs text-gray-400">Система управления заказами в реальном времени</p>
      </div>
    </div>

    <!-- Вкладки фильтрации (Активные / Готовые) -->
    <div class="flex items-center bg-gray-900 p-1 rounded-2xl border border-gray-800">
      <button id="tabActive" class="px-4 py-2 text-xs font-bold rounded-xl bg-amber-500 text-gray-950 transition shadow-md">
        Активные (<span id="countActive">0</span>)
      </button>
      <button id="tabHistory" class="px-4 py-2 text-xs font-bold rounded-xl text-gray-400 hover:text-white transition">
        История выданных
      </button>
    </div>

    <div class="flex items-center gap-3">
      <button id="enableAudioBtn" class="px-4 py-2.5 bg-gray-800 hover:bg-gray-700 text-amber-400 border border-gray-700 font-bold text-xs rounded-xl transition flex items-center gap-2">
        <span>🔇 Звук выключен</span>
      </button>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ СЕТКИ ЗАКАЗОВ -->
  <main class="flex-1">
    <div id="kitchenOrdersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
      <!-- Карточки заказов генерируются через JS -->
    </div>

    <!-- Пустое состояние -->
    <div id="noOrdersState" class="hidden text-center py-32">
      <svg class="w-16 h-16 mx-auto mb-4 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
      </svg>
      <h3 class="text-lg font-bold text-gray-400">Все заказы выполнены!</h3>
      <p class="text-xs mt-1 text-gray-500">Ожидаем новые заказы со столиков...</p>
    </div>
  </main>

  <!-- ФУТЕР СТАТИСТИКИ -->
  <footer class="mt-8 pt-4 border-t border-gray-800/80 flex items-center justify-between text-xs text-gray-500">
    <div class="flex items-center gap-4">
      <span>🟢 < 3 мин (Норма)</span>
      <span>🟡 3-6 мин (Внимание)</span>
      <span>🔴 > 6 мин (Задержка!)</span>
    </div>
    <div>Иман Кафе KDS v2.0 • Разработано для ресторанов</div>
  </footer>

  <!-- СКРИПТ ЛОГИКИ КУХНИ -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBohllCT8Jzt23W3kcjRt8n-yOUWZEfxcU",
      authDomain: "iman-menu.firebaseapp.com",
      databaseURL: "https://iman-menu-default-rtdb.firebaseio.com",
      projectId: "iman-menu",
      storageBucket: "iman-menu.firebasestorage.app",
      messagingSenderId: "227236434910",
      appId: "1:227236434910:web:83445bb6325c5cefff834f",
      measurementId: "G-ZHYW9DB8ZF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const gridEl = document.getElementById('kitchenOrdersGrid');
    const noOrdersStateEl = document.getElementById('noOrdersState');
    const countActiveEl = document.getElementById('countActive');
    const enableAudioBtn = document.getElementById('enableAudioBtn');
    const tabActiveBtn = document.getElementById('tabActive');
    const tabHistoryBtn = document.getElementById('tabHistory');

    let audioAllowed = false;
    let currentTab = 'active'; // 'active' или 'history'
    let ordersCache = {};
    let previousOrdersCount = 0;

    enableAudioBtn.addEventListener('click', () => {
      audioAllowed = !audioAllowed;
      if (audioAllowed) {
        enableAudioBtn.innerHTML = '<span>🔊 Звук включен</span>';
        enableAudioBtn.classList.remove('bg-gray-800', 'text-amber-400', 'border-gray-700');
        enableAudioBtn.classList.add('bg-emerald-600', 'text-white', 'border-emerald-500');
        playBeep();
      } else {
        enableAudioBtn.innerHTML = '<span>🔇 Звук выключен</span>';
        enableAudioBtn.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-500');
        enableAudioBtn.classList.add('bg-gray-800', 'text-amber-400', 'border-gray-700');
      }
    });

    // Аудиосигнал нового заказа (двойной короткий бИП)
    function playBeep() {
      if (!audioAllowed) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(950, now);
        gain.gain.setValueAtTime(0.25, now);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start(now);
        osc.stop(now + 0.15);

        setTimeout(() => {
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(1200, ctx.currentTime);
          gain2.gain.setValueAtTime(0.25, ctx.currentTime);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start();
          osc2.stop(ctx.currentTime + 0.2);
        }, 180);
      } catch (e) {
        console.log(e);
      }
    }

    tabActiveBtn.addEventListener('click', () => {
      currentTab = 'active';
      tabActiveBtn.className = "px-4 py-2 text-xs font-bold rounded-xl bg-amber-500 text-gray-950 transition shadow-md";
      tabHistoryBtn.className = "px-4 py-2 text-xs font-bold rounded-xl text-gray-400 hover:text-white transition";
      renderOrders();
    });

    tabHistoryBtn.addEventListener('click', () => {
      currentTab = 'history';
      tabHistoryBtn.className = "px-4 py-2 text-xs font-bold rounded-xl bg-amber-500 text-gray-950 transition shadow-md";
      tabActiveBtn.className = "px-4 py-2 text-xs font-bold rounded-xl text-gray-400 hover:text-white transition";
      renderOrders();
    });

    const ordersRef = ref(db, 'orders');
    onValue(ordersRef, (snapshot) => {
      const data = snapshot.val();
      ordersCache = data || {};

      const ordersList = Object.entries(ordersCache);
      const activeCount = ordersList.filter(([_, o]) => o.status === 'new' || o.status === 'cooking').length;
      countActiveEl.textContent = activeCount;

      // Проверка на новый заказ для звука
      const newOrdersCount = ordersList.filter(([_, o]) => o.status === 'new').length;
      if (newOrdersCount > previousOrdersCount && previousOrdersCount !== -1) {
        playBeep();
      }
      previousOrdersCount = newOrdersCount;

      renderOrders();
    });

    // Перерисовка экрана повара каждую секунду (чтобы таймеры времени тикали)
    setInterval(() => {
      if (Object.keys(ordersCache).length > 0) {
        renderOrders();
      }
    }, 1000);

    function renderOrders() {
      const data = ordersCache;
      if (!data) {
        gridEl.innerHTML = '';
        noOrdersStateEl.classList.remove('hidden');
        return;
      }

      let orders = Object.entries(data).map(([id, val]) => ({ id, ...val }));
      
      // Фильтрация по вкладкам
      if (currentTab === 'active') {
        orders = orders.filter(o => o.status === 'new' || o.status === 'cooking');
      } else {
        orders = orders.filter(o => o.status === 'ready');
      }

      orders.sort((a, b) => b.timestamp - a.timestamp);

      if (orders.length === 0) {
        gridEl.innerHTML = '';
        noOrdersStateEl.classList.remove('hidden');
        return;
      }

      noOrdersStateEl.classList.add('hidden');

      const now = Date.now();

      gridEl.innerHTML = orders.map(order => {
        const elapsedSeconds = Math.floor((now - order.timestamp) / 1000);
        const mins = Math.floor(elapsedSeconds / 60);
        const secs = elapsedSeconds % 60;
        const timeFormatted = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

        // Таймерные цвета а-ля Макдоналдс
        let timerBg = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
        let cardBorder = 'border-gray-800 bg-gray-900/90';

        if (order.status === 'new') {
          if (mins >= 6) {
            timerBg = 'bg-red-500/20 text-red-400 border-red-500/50 animate-pulse';
            cardBorder = 'border-red-500 bg-gray-900 ring-2 ring-red-500/30';
          } else if (mins >= 3) {
            timerBg = 'bg-amber-500/20 text-amber-400 border-amber-500/50';
            cardBorder = 'border-amber-500/80 bg-gray-900';
          } else {
            timerBg = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50';
            cardBorder = 'border-blue-500/60 bg-gray-900';
          }
        } else if (order.status === 'cooking') {
          cardBorder = 'border-blue-600 bg-gray-900';
          timerBg = 'bg-blue-500/20 text-blue-400 border-blue-500/30';
        } else if (order.status === 'ready') {
          cardBorder = 'border-gray-800 bg-gray-950/50 opacity-50';
        }

        const itemsHtml = order.items.map(i => `
          <div class="flex justify-between items-center text-sm py-1.5 border-b border-gray-800/60 last:border-0">
            <span class="font-semibold text-gray-200">${i.name}</span>
            <span class="bg-gray-800 px-2.5 py-0.5 rounded-lg font-black text-xs text-amber-400">×${i.quantity}</span>
          </div>
        `).join('');

        return `
          <div class="order-card ${cardBorder} border-2 rounded-3xl p-5 flex flex-col justify-between shadow-xl">
            <div>
              <!-- Шапка карточки: Стол и Таймер -->
              <div class="flex items-center justify-between mb-3.5">
                <span class="px-3.5 py-1.5 bg-amber-500 text-gray-950 font-black text-sm rounded-xl uppercase tracking-wider shadow-sm">
                  Стол №${order.table}
                </span>
                <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-xl border text-xs font-black ${timerBg}">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                  </svg>
                  <span>${timeFormatted}</span>
                </div>
              </div>

              <!-- Список блюд -->
              <div class="space-y-1 mb-4 bg-black/30 p-3.5 rounded-2xl border border-gray-800/40">
                ${itemsHtml}
              </div>
            </div>

            <div>
              <!-- Сумма и время создания -->
              <div class="flex items-center justify-between mb-3.5 pt-2 border-t border-gray-800 text-xs">
                <span class="text-gray-400">Сумма заказа:</span>
                <span class="font-black text-white text-base">${order.total} сом</span>
              </div>

<!-- Кнопки управления -->
              <div class="grid grid-cols-1 gap-2">
                ${order.status === 'new' ? `
                  <button onclick="updateStatus('${order.id}', 'cooking')" class="w-full py-3 bg-blue-600 hover:bg-blue-500 active:scale-98 text-white font-black text-xs uppercase tracking-wider rounded-xl transition shadow-lg shadow-blue-600/30">
                    👨‍🍳 Принять в работу
                  </button>
                ` : order.status === 'cooking' ? `
                  <button onclick="updateStatus('${order.id}', 'ready')" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 active:scale-98 text-white font-black text-xs uppercase tracking-wider rounded-xl transition shadow-lg shadow-emerald-600/30">
                    ✅ Готово / Выдать
                  </button>
                ` : `
                  <div class="flex gap-2">
                    <button onclick="updateStatus('${order.id}', 'new')" class="flex-1 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold text-xs rounded-xl transition">
                      Вернуть
                    </button>
                    <button onclick="deleteOrder('${order.id}')" class="py-2 px-4 bg-red-950 hover:bg-red-900 text-red-400 font-bold text-xs rounded-xl transition">
                      Удалить
                    </button>
                  </div>
                `}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.updateStatus = async function(orderId, newStatus) {
      await update(ref(db, `orders/${orderId}`), { status: newStatus });
    }

    window.deleteOrder = async function(orderId) {
      if (confirm('Удалить этот заказ из архива?')) {
        await remove(ref(db, `orders/${orderId}`));
      }
    }
  </script>
</body>
</html>
