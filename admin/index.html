<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель управления кафе (Admin)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #0F172A; }
  </style>
</head>
<body class="antialiased min-h-screen">

  <!-- Экран входа -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-3xl border border-gray-200 p-8 shadow-xl">
      <div class="text-center mb-6">
        <span class="inline-block px-3 py-1 bg-amber-100 text-amber-700 font-bold text-xs rounded-full mb-2">SaaS Панель</span>
        <h1 class="text-2xl font-extrabold text-gray-900">Вход для владельца</h1>
        <p class="text-xs text-gray-500 mt-1">Управление меню, ценами и стоп-листом</p>
      </div>

      <form id="loginForm" onsubmit="return false;" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Email</label>
          <input type="email" id="emailInput" required placeholder="admin@ulugbek.kg" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Пароль</label>
          <input type="password" id="passwordInput" required placeholder="••••••" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-amber-500">
        </div>
        <p id="loginError" class="hidden text-xs text-rose-600 font-semibold"></p>
        <button type="submit" id="loginBtn" class="w-full py-3 bg-gray-900 hover:bg-gray-800 text-white font-bold text-sm rounded-xl transition shadow-md">
          Войти в кабинет
        </button>
      </form>
    </div>
  </div>

  <!-- Основная панель администратора -->
  <div id="adminPanel" class="hidden max-w-4xl mx-auto p-4 sm:p-6 pb-20">
    
    <!-- Шапка -->
    <header class="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-gray-200 mb-6">
      <div>
        <h1 id="adminCafeName" class="text-2xl font-extrabold text-gray-900">Загрузка...</h1>
        <p class="text-xs text-gray-500 mt-0.5">ID заведения: <span id="cafeIdDisplay" class="font-mono font-bold text-gray-700"></span></p>
      </div>
      <button id="logoutBtn" class="px-4 py-2 bg-white hover:bg-gray-100 text-gray-700 font-bold text-xs rounded-xl border border-gray-300 transition">
        Выйти
      </button>
    </header>

    <!-- Блок добавления нового блюда -->
    <section class="bg-white rounded-2xl border border-gray-200 p-5 mb-6 shadow-sm">
      <h2 class="text-base font-extrabold text-gray-900 mb-4">Добавить новое блюдо</h2>
      <form id="addDishForm" onsubmit="return false;" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <input type="text" id="dishName" required placeholder="Название (напр. Лагман)" class="px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm">
        <input type="number" id="dishPrice" required placeholder="Цена в сомах (напр. 220)" class="px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm">
        <input type="text" id="dishDesc" placeholder="Описание (состав)" class="px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm">
        <input type="url" id="dishImg" placeholder="Ссылка на фото (https://...)" class="px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm">
        
        <div class="sm:col-span-2 lg:col-span-4 flex justify-end mt-1">
          <button type="submit" id="addDishBtn" class="px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold text-sm rounded-xl transition shadow-sm">
            Добавить в меню
          </button>
        </div>
      </form>
    </section>

    <!-- Список блюд в админке -->
    <section class="bg-white rounded-2xl border border-gray-200 p-5 shadow-sm">
      <h2 class="text-base font-extrabold text-gray-900 mb-4">Управление меню</h2>
      <div id="adminMenuList" class="space-y-3">
        <p class="text-xs text-gray-400">Загрузка блюд...</p>
      </div>
    </section>

  </div>

  <!-- Firebase Скрипты -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBohllCT8Jzt23W3kcjRt8n-yOUWZEfxcU",
      authDomain: "restoran-test-e7514.firebaseapp.com",
      databaseURL: "https://restoran-test-e7514-default-rtdb.firebaseio.com",
      projectId: "restoran-test-e7514",
      storageBucket: "restoran-test-e7514.appspot.com",
      messagingSenderId: "392558696805",
      appId: "1:392558696805:web:adb7fa161cb704f08db4f4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const loginScreen = document.getElementById('loginScreen');
    const adminPanel = document.getElementById('adminPanel');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const logoutBtn = document.getElementById('logoutBtn');
    const addDishForm = document.getElementById('addDishForm');

    let currentUserId = null;

    // Обработка входа
    loginForm.addEventListener('submit', async () => {
      loginError.classList.add('hidden');
      try {
        await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
      } catch (error) {
        loginError.textContent = "Ошибка входа: неверный email или пароль";
        loginError.classList.remove('hidden');
      }
    });

    // Выход из системы
    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
    });

    // Отслеживание состояния сессии
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUserId = user.uid;
        loginScreen.classList.add('hidden');
        adminPanel.classList.remove('hidden');
        document.getElementById('cafeIdDisplay').textContent = user.uid;
        document.getElementById('adminCafeName').textContent = "Кабинет владельца";
        loadAdminMenu(user.uid);
      } else {
        currentUserId = null;
        loginScreen.classList.remove('hidden');
        adminPanel.classList.add('hidden');
      }
    });

    // Добавление блюда
    addDishForm.addEventListener('submit', () => {
      if (!currentUserId) return;

      const name = document.getElementById('dishName').value.trim();
      const price = Number(document.getElementById('dishPrice').value);
      const description = document.getElementById('dishDesc').value.trim();
      const image = document.getElementById('dishImg').value.trim() || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c';

      if (!name || !price) return;

      const newDishRef = push(ref(db, `cafes/${currentUserId}/menu`));
      set(newDishRef, {
        id: newDishRef.key,
        name,
        price,
        description,
        image
      }).then(() => {
        addDishForm.reset();
        alert('Блюдо успешно добавлено в меню!');
      });
    });

    // Загрузка меню в админку
    function loadAdminMenu(uid) {
      onValue(ref(db, `cafes/${uid}/menu`), (snapshot) => {
        const data = snapshot.val();
        const container = document.getElementById('adminMenuList');
        
        if (!data) {
          container.innerHTML = '<p class="text-xs text-gray-400">Меню пока пустое. Добавьте первое блюдо выше.</p>';
          return;
        }

        container.innerHTML = Object.entries(data).map(([key, item]) => `
          <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-200">
            <div class="flex items-center gap-3">
              <img src="${item.image}" alt="${item.name}" class="w-12 h-12 object-cover rounded-lg">
              <div>
                <h3 class="font-bold text-sm text-gray-900">${item.name}</h3>
                <p class="text-xs text-gray-500">${item.price} сом · ${item.description || 'Без описания'}</p>
              </div>
            </div>
            <button onclick="window.deleteDish('${key}')" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs rounded-lg transition">
              Удалить
            </button>
          </div>
        `).join('');
      });
    }

    // Удаление блюда
    window.deleteDish = (dishKey) => {
      if (!currentUserId) return;
      if (confirm('Точно удалить это блюдо из меню?')) {
        remove(ref(db, `cafes/${currentUserId}/menu/${dishKey}`));
      }
    };
  </script>
</body>
</html>
