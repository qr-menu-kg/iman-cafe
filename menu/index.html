<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Онлайн-меню</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #0F172A; }
  </style>
</head>
<body class="antialiased min-h-screen pb-28">

  <!-- Шапка -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10 px-4 py-4">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div>
        <h1 id="cafeName" class="text-xl font-extrabold text-gray-900">Загрузка меню...</h1>
        <p id="tableBadge" class="text-xs font-semibold text-amber-600 mt-0.5">Столик №1</p>
      </div>
      <div class="flex gap-2">
        <button onclick="window.callService('Позвать официанта 🔔')" class="px-3 py-2 bg-amber-50 hover:bg-amber-100 text-amber-700 font-semibold text-xs rounded-xl border border-amber-200 transition">
          Официант
        </button>
        <button onclick="window.callService('Попросить счет 💳')" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold text-xs rounded-xl transition">
          Счет
        </button>
      </div>
    </div>
  </header>

  <!-- Список блюд -->
  <main class="max-w-2xl mx-auto p-4">
    <div id="menuList" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="col-span-full text-center py-12 text-gray-400">Загружаем блюда из базы...</div>
    </div>
  </main>

  <!-- Нижняя панель заказа -->
  <div id="cartBar" class="hidden fixed bottom-0 inset-x-0 bg-white border-t border-gray-200 p-4 shadow-lg">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div>
        <p class="text-xs text-gray-500">Выбрано блюд: <span id="cartCount" class="font-bold text-gray-900">0</span></p>
        <p class="text-lg font-extrabold text-gray-900"><span id="cartTotal">0</span> сом</p>
      </div>
      <button onclick="window.submitOrder()" id="submitOrderBtn" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-xl transition shadow-md">
        Отправить на кухню
      </button>
    </div>
  </div>

  <!-- Скрипт меню -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
    import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

    const db = getDatabase(initializeApp({
      databaseURL: "https://iman-menu-default-rtdb.firebaseio.com"
    }));

    const params = new URLSearchParams(window.location.search);
    const cafeId = params.get('cafe') || 'ulugbek';
    const tableNum = params.get('table') || '1';

    document.getElementById('tableBadge').textContent = `Столик №${tableNum}`;

    let menuData = {};
    let stopList = {};
    let cart = {};

    // Загружаем данные кафе
    onValue(ref(db, `cafes/${cafeId}`), snapshot => {
      const cafe = snapshot.val();
      if (!cafe) {
        document.getElementById('cafeName').textContent = 'Кафе не найдено';
        return;
      }
      document.getElementById('cafeName').textContent = cafe.name || 'Онлайн-меню';
      menuData = cafe.menu || {};
      stopList = cafe.stopList || {};
      renderMenu();
    });

    function renderMenu() {
      const list = document.getElementById('menuList');
      const items = Object.values(menuData);

      if (items.length === 0) {
        list.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400">Меню пока пустое</div>';
        return;
      }

      list.innerHTML = items.map(item => {
        const isStopped = stopList[item.id] === true;
        const qty = cart[item.id] || 0;
        
        return `
          <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm flex flex-col justify-between ${isStopped ? 'opacity-50' : ''}">
            <div>
              <div class="relative h-44 bg-gray-100">
                <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
                ${item.badge ? `<span class="absolute top-3 left-3 px-2.5 py-1 bg-amber-500 text-white text-xs font-bold rounded-lg shadow">${item.badge}</span>` : ''}
              </div>
              <div class="p-4">
                <h3 class="font-bold text-gray-900 text-base">${item.name}</h3>
                <p class="text-xs text-gray-500 mt-1">${item.description || ''}</p>
              </div>
            </div>
            <div class="px-4 pb-4 flex items-center justify-between">
              <span class="font-extrabold text-gray-900">${item.price} сом</span>
              ${isStopped 
                ? `<span class="text-xs font-bold text-rose-500">Нет в наличии</span>` 
                : (qty === 0 
                    ? `<button onclick="window.addToCart('${item.id}')" class="px-4 py-2 bg-gray-900 hover:bg-gray-800 text-white text-xs font-bold rounded-xl transition">+ В заказ</button>`
                    : `<div class="flex items-center gap-2">
                         <button onclick="window.removeFromCart('${item.id}')" class="w-8 h-8 bg-gray-100 hover:bg-gray-200 font-bold text-gray-800 rounded-xl transition">-</button>
                         <span class="font-bold text-sm w-4 text-center">${qty}</span>
                         <button onclick="window.addToCart('${item.id}')" class="w-8 h-8 bg-gray-900 hover:bg-gray-800 text-white font-bold rounded-xl transition">+</button>
                       </div>`
                  )
              }
            </div>
          </div>
        `;
      }).join('');
    }

    window.addToCart = (id) => {
      cart[id] = (cart[id] || 0) + 1;
      updateCartUI();
      renderMenu();
    };

    window.removeFromCart = (id) => {
      if (cart[id]) {
        cart[id]--;
        if (cart[id] <= 0) {
          delete cart[id];
        }
      }
      updateCartUI();
      renderMenu();
    };

    function updateCartUI() {
      const bar = document.getElementById('cartBar');
      let count = 0;
      let total = 0;

      for (const [id, qty] of Object.entries(cart)) {
        if (menuData[id]) {
          count += qty;
          total += menuData[id].price * qty;
        }
      }

      if (count > 0) {
        bar.classList.remove('hidden');
        document.getElementById('cartCount').textContent = count;
        document.getElementById('cartTotal').textContent = total;
      } else {
        bar.classList.add('hidden');
      }
    }

    // --- АНТИХУЛИГАН (Защита от спама и фейковых кликов) ---
    function checkAntiSpam(actionKey, cooldownSec = 15) {
      const lastTime = localStorage.getItem(actionKey);
      const now = Date.now();
      if (lastTime && (now - parseInt(lastTime)) < cooldownSec * 1000) {
        const remaining = Math.ceil((cooldownSec * 1000 - (now - parseInt(lastTime))) / 1000);
        alert(`Подождите ${remaining} сек. перед повторной отправкой.`);
        return false;
      }
      localStorage.setItem(actionKey, now.toString());
      return true;
    }

    window.callService = (title) => {
      // Антихулиган для вызова официанта/счета (кулдаун 15 секунд)
      if (!checkAntiSpam('last_service_call', 15)) return;

      push(ref(db, 'orders'), {
        cafeId,
        table: tableNum,
        type: 'service',
        serviceTitle: title,
        status: 'new',
        timestamp: Date.now()
      }).then(() => alert(`Запрос «${title}» отправлен!`));
    };

    window.submitOrder = () => {
      // Антихулиган для отправки заказа на кухню (кулдаун 20 секунд от спама заказами)
      if (!checkAntiSpam('last_order_submit', 20)) return;

      const itemsList = Object.entries(cart).map(([id, qty]) => ({
        name: menuData[id].name,
        qty,
        price: menuData[id].price
      }));

      if (itemsList.length === 0) return;

      push(ref(db, 'orders'), {
        cafeId,
        table: tableNum,
        type: 'food',
        items: itemsList,
        status: 'new',
        timestamp: Date.now()
      }).then(() => {
        cart = {};
        updateCartUI();
        renderMenu();
        alert('Заказ успешно отправлен на кухню!');
      });
    };
  </script>
</body>
</html>
