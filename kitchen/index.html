<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кухонный планшет (KDS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #F8FAFC; }
  </style>
</head>
<body class="antialiased min-h-screen p-4 sm:p-6">

  <!-- Шапка кухни -->
  <header class="flex items-center justify-between pb-6 border-b border-gray-800 mb-6">
    <div>
      <h1 id="kitchenTitle" class="text-xl sm:text-2xl font-extrabold tracking-tight">Кухня: Загрузка...</h1>
      <p class="text-xs sm:text-sm text-gray-400 mt-0.5">Терминал приема заказов в реальном времени</p>
    </div>
    <div class="flex items-center gap-3">
      <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-500/10 text-emerald-400 font-semibold text-xs border border-emerald-500/20">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Онлайн
      </span>
    </div>
  </header>

  <!-- Сетка заказов -->
  <main>
    <div id="ordersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="p-8 rounded-2xl bg-slate-800/50 border border-slate-700/50 text-center text-slate-400">
        Ожидание новых заказов...
      </div>
    </div>
  </main>

  <!-- Скрипт кухни -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

    const db = getDatabase(initializeApp({
      databaseURL: "https://iman-menu-default-rtdb.firebaseio.com"
    }));

    const params = new URLSearchParams(window.location.search);
    const cafeId = params.get('cafe') || 'ulugbek';

    // Получаем имя кафе для шапки
    onValue(ref(db, `cafes/${cafeId}/name`), snapshot => {
      if (snapshot.exists()) {
        document.getElementById('kitchenTitle').textContent = `Кухня — ${snapshot.val()}`;
      }
    });

    // Слушаем заказы
    onValue(ref(db, 'orders'), snapshot => {
      const data = snapshot.val();
      const grid = document.getElementById('ordersGrid');

      if (!data) {
        grid.innerHTML = '<div class="col-span-full p-8 rounded-2xl bg-slate-800/50 border border-slate-700/50 text-center text-slate-400">Нет активных заказов</div>';
        return;
      }

      const orders = Object.entries(data)
        .filter(([_, order]) => order.cafeId === cafeId && order.status !== 'completed')
        .sort((a, b) => b.timestamp - a.timestamp);

      if (orders.length === 0) {
        grid.innerHTML = '<div class="col-span-full p-8 rounded-2xl bg-slate-800/50 border border-slate-700/50 text-center text-slate-400">Все заказы выполнены! 🎉</div>';
        return;
      }

      grid.innerHTML = orders.map(([id, order]) => {
        const timeStr = new Date(order.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        return `
          <div class="bg-slate-800/90 border border-slate-700/70 rounded-2xl p-4 flex flex-col justify-between shadow-xl">
            <div>
              <div class="flex items-center justify-between pb-3 border-b border-slate-700 mb-3">
                <span class="font-extrabold text-amber-400 text-sm">Столик №${order.table}</span>
                <span class="text-xs text-slate-400">${timeStr}</span>
              </div>
              
              <div class="py-4 text-center font-bold text-lg text-rose-400">
                ${order.serviceTitle || 'Заказ блюд'}
              </div>
            </div>

            <div class="pt-3 border-t border-slate-700 flex gap-2">
              <button onclick="window.completeOrder('${id}')" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl transition">
                Готово / Закрыть
              </button>
            </div>
          </div>
        `;
      }).join('');
    });

    window.completeOrder = (orderId) => {
      update(ref(db, `orders/${orderId}`), { status: 'completed' });
    };
  </script>
</body>
</html>
