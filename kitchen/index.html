<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Cafe — Кухня (KDS Pro)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f8fafc; }
    @media print {
      body { background: white; color: black; }
      header, footer, button, .no-print { display: none !important; }
      .order-card { border: 1px solid #000 !important; background: #fff !important; color: #000 !important; box-shadow: none !important; width: 100% !important; }
    }
  </style>
</head>
<body class="p-4 sm:p-6 min-h-screen flex flex-col justify-between">

  <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between pb-5 mb-6 border-b border-gray-800 gap-4">
    <div class="flex items-center gap-3">
      <span class="w-3.5 h-3.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <div>
        <h1 class="text-2xl font-black text-white">КУХНЯ — KDS PRO</h1>
        <p class="text-xs text-gray-400">Система управления заказами</p>
      </div>
    </div>
    <div class="flex items-center bg-gray-900 p-1 rounded-2xl border border-gray-800">
      <button id="tabActive" class="px-4 py-2 text-xs font-bold rounded-xl bg-amber-500 text-gray-950">Активные (<span id="countActive">0</span>)</button>
      <button id="tabHistory" class="px-4 py-2 text-xs font-bold rounded-xl text-gray-400">История</button>
    </div>
    <button id="enableAudioBtn" class="px-4 py-2 bg-gray-800 text-amber-400 font-bold text-xs rounded-xl border border-gray-700">🔇 Звук выключен</button>
  </header>

  <main class="flex-1">
    <div id="kitchenOrdersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
    <div id="noOrdersState" class="hidden text-center py-32"><h3 class="text-lg font-bold text-gray-400">Список пуст</h3></div>
  </main>

  <footer class="mt-8 pt-4 border-t border-gray-800 flex items-center justify-between text-xs text-gray-500">
    <div>🟢 Норма | 🟡 Внимание | 🔴 Задержка</div>
    <div>Smart Cafe KDS v2.5</div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove, set } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

    const db = getDatabase(initializeApp({
      databaseURL: "https://iman-menu-default-rtdb.firebaseio.com"
    }));

    let audioAllowed = false, currentTab = 'active', ordersCache = {}, prevCount = -1;

    document.getElementById('enableAudioBtn').addEventListener('click', () => {
      audioAllowed = !audioAllowed;
      event.target.textContent = audioAllowed ? '🔊 Звук включен' : '🔇 Звук выключен';
    });

    onValue(ref(db, 'orders'), snap => {
      ordersCache = snap.val() || {};
      const list = Object.entries(ordersCache);
      document.getElementById('countActive').textContent = list.filter(([_, o]) => o.status === 'new' || o.status === 'cooking').length;
      render();
    });

    setInterval(render, 1000);

    function render() {
      const now = Date.now();
      const all = Object.entries(ordersCache).map(([id, val]) => ({ id, ...val }));
      
      const firstDev = {};
      all.filter(o => o.type !== 'service' && (now - o.timestamp) < 7200000 && o.deviceId).forEach(o => {
        if (!firstDev[o.table]) firstDev[o.table] = o.deviceId;
      });

      let filtered = all.filter(o => currentTab === 'active' ? (o.status === 'new' || o.status === 'cooking') : (o.status === 'ready' && o.type !== 'service'));
      filtered.sort((a, b) => b.timestamp - a.timestamp);

      const grid = document.getElementById('kitchenOrdersGrid');
      if (filtered.length === 0) { grid.innerHTML = ''; document.getElementById('noOrdersState').classList.remove('hidden'); return; }
      document.getElementById('noOrdersState').classList.add('hidden');

      grid.innerHTML = filtered.map(order => {
        const mins = Math.floor((now - order.timestamp) / 60000);
        const secs = Math.floor(((now - order.timestamp) % 60000) / 1000);
        const timeStr = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        const isDiff = order.deviceId && firstDev[order.table] && order.deviceId !== firstDev[order.table];

        if (order.type === 'service') {
          return `
            <div class="border-2 border-purple-500 bg-purple-950/40 rounded-3xl p-5 flex flex-col justify-between shadow-xl">
              <div>
                <div class="flex justify-between mb-2"><span class="px-3 py-1 bg-purple-600 text-white font-bold text-sm rounded-xl">Стол №${order.table}</span><span class="text-xs text-purple-300">⏱ ${timeStr}</span></div>
                <div class="my-4 p-4 bg-purple-900/50 rounded-2xl text-center"><p class="text-lg font-black text-white">${order.serviceTitle}</p></div>
              </div>
              <button onclick="window.deleteOrder('${order.id}')" class="w-full py-2 bg-purple-600 text-white font-bold text-xs rounded-xl">✔️ Закрыть вызов</button>
            </div>
          `;
        }

        const itemsHtml = order.items.map(i => `
          <div class="py-1.5 border-b border-gray-800 text-sm flex justify-between items-center">
            <div><span class="font-semibold text-gray-200">${i.name}</span><p class="text-[11px] text-gray-400">${i.price} сом × ${i.quantity}</p></div>
            <span class="font-bold text-amber-400">${i.subtotal} сом</span>
          </div>
        `).join('');

        return `
          <div class="order-card border-2 ${isDiff ? 'border-amber-400 bg-gray-900 ring-4 ring-amber-500/20' : 'border-gray-800 bg-gray-900'} rounded-3xl p-5 flex flex-col justify-between shadow-xl">
            <div>
              <div class="flex justify-between items-center mb-2">
                <span class="px-3.5 py-1.5 bg-amber-500 text-gray-950 font-black text-sm rounded-xl">Стол №${order.table}</span>
                <span class="px-2.5 py-1 rounded-xl border text-xs font-bold ${mins >= 6 ? 'bg-red-500/20 text-red-400' : 'bg-emerald-500/20 text-emerald-400'}">⏱ ${timeStr}</span>
              </div>
              <div class="text-[11px] font-bold text-gray-400 mb-2">📱 Гость #${order.deviceId || '---'}</div>
              ${isDiff ? '<div class="mb-2 p-2 bg-amber-500/20 text-amber-200 text-xs font-bold rounded-xl">⚠️ Внимание! Заказ со 2-го телефона!</div>' : ''}
              <div class="space-y-1 mb-4 bg-black/30 p-3 rounded-2xl border border-gray-800">${itemsHtml}</div>
            </div>
            <div>
              <div class="flex justify-between mb-3 pt-2 border-t border-gray-800 text-sm">
                <span class="text-gray-400">Итого сумма:</span>
                <span class="font-black text-white text-base">${order.total} сом</span>
              </div>
              <div class="grid grid-cols-2 gap-2 no-print">
                ${order.status === 'new' ? `<button onclick="window.updateStatus('${order.id}', 'cooking')" class="col-span-2 py-2.5 bg-blue-600 text-white font-bold text-xs rounded-xl">👨‍🍳 Готовить</button>` : ''}
                ${order.status === 'cooking' ? `<button onclick="window.updateStatus('${order.id}', 'ready')" class="col-span-2 py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl">✅ Выдать</button>` : ''}
                <button onclick="window.print()" class="py-2 bg-gray-800 text-gray-300 font-bold text-xs rounded-xl">🖨 Чек</button>
                <button onclick="window.deleteOrder('${order.id}')" class="py-2 bg-red-950 text-red-400 font-bold text-xs rounded-xl">🗑 Удалить</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('tabActive').addEventListener('click', e => { currentTab = 'active'; e.target.className = "px-4 py-2 text-xs font-bold rounded-xl bg-amber-500 text-gray-950"; document.getElementById('tabHistory').className = "px-4 py-2 text-xs font-bold rounded-xl text-gray-400"; render(); });
    document.getElementById('tabHistory').addEventListener('click', e => { currentTab = 'history'; e.target.className = "px-4 py-2 text-xs font-bold rounded-xl bg-amber-500 text-gray-950"; document.getElementById('tabActive').className = "px-4 py-2 text-xs font-bold rounded-xl text-gray-400"; render(); });

    window.updateStatus = (id, status) => update(ref(db, `orders/${id}`), { status });
    window.deleteOrder = id => remove(ref(db, `orders/${id}`));
  </script>
</body>
</html>
